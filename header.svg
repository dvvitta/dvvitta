<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .hdr-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 6px; fill: #ffb347; }
      .hdr-sub { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 3px; fill: #9ca3af; }
      .corner { stroke: #f5a623; stroke-width: 2; fill: none; opacity: .8; }
      .glowbar { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .25; }
      }
    </style>
    <radialGradient id="hdrBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#161022" />
      <stop offset="100%" stop-color="#05030a" />
    </radialGradient>
    <filter id="glowHdr" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Box & Border -->
  <rect x="3" y="3" width="894" height="114" rx="14" fill="url(#hdrBg)" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Sudut Siku-siku Cyberpunk -->
  <path class="corner" d="M18 35 L18 18 L35 18" />
  <path class="corner" d="M882 35 L882 18 L865 18" />
  <path class="corner" d="M18 85 L18 102 L35 102" />
  <path class="corner" d="M882 85 L882 102 L865 102" />

  <!-- Teks & Glow Bar -->
  <text x="450" y="52" text-anchor="middle" class="hdr-title" filter="url(#glowHdr)">CONNECT</text>
  <rect class="glowbar" x="385" y="65" width="130" height="2" fill="#ffb347" filter="url(#glowHdr)" />
  <text x="450" y="88" text-anchor="middle" class="hdr-sub">// ESTABLISHING UPLINK — DEVITA ANGGRAENI</text>
</svg>