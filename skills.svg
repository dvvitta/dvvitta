<g class="pill" style="animation-delay:.45s"><rect x="614" y="278" width="140" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.3" filter="url(#glow)"/><text x="684" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">PROTOTYPING</text><rect class="trace" x="614" y="278" width="140" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250" style="animation-delay:.45s"/></g>
</g>

