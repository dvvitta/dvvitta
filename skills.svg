<g class="pill" style="animation-delay:.10s"><rect x="267" y="158" width="85" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="309" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">REACT</text><rect class="trace" x="267" y="158" width="85" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250" style="animation-delay:.10s"/></g>
<g class="pill" style="animation-delay:.20s"><rect x="367" y="158" width="95" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="414" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">NEXT.JS</text><rect class="trace" x="367" y="158" width="95" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250" style="animation-delay:.20s"/></g>
<g class="pill" style="animation-delay:.30s"><rect x="477" y="158" width="130" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="542" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">TAILWIND CSS</text><rect class="trace" x="477" y="158" width="130" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250" style="animation-delay:.30s"/></g>
<g class="pill" style="animation-delay:.40s"><rect x="622" y="158" width="135" height="34" rx="9" fill="#0c1830" stroke="#2563eb" stroke-width="1.3" filter="url(#glow)"/><text x="689" y="180" text-anchor="middle" class="pill-text" fill="#bfdbfe">HTML5 &amp; CSS3</text><rect class="trace" x="622" y="158" width="136" height="34" rx="9" stroke="#2563eb" stroke-dasharray="30 250" style="animation-delay:.40s"/></g>
</g>

