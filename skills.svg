<g class="pill" style="animation-delay:.35s"><rect x="577" y="518" width="115" height="34" rx="9" fill="#06211d" stroke="#0d9488" stroke-width="1.3" filter="url(#glow)"/><text x="634" y="540" text-anchor="middle" class="pill-text" fill="#99f6e4">REST APIS</text><rect class="trace" x="557" y="518" width="115" height="34" rx="9" stroke="#0d9488" stroke-dasharray="30 250" style="animation-delay:.35s"/></g>


