<g class="pill" style="animation-delay:.20s"><rect x="416" y="398" width="90" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="461" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">SQLITE</text><rect class="trace" x="416" y="398" width="90" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250" style="animation-delay:.20s"/></g>
<g class="pill" style="animation-delay:.30s"><rect x="524" y="398" width="175" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.3" filter="url(#glow)"/><text x="611" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">MACHINE LEARNING</text><rect class="trace" x="524" y="398" width="175" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250" style="animation-delay:.30s"/></g>
</g>

